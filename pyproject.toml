[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "awstools"
version = "0.1.0"
dependencies = [
    "botocore[crt]",
    "boto3",
]
requires-python = ">=3.12"

[tool.setuptools.packages.find]
# ここに追加するコマンド名を追加する。
include = ["sgzu", "storeparam"]

# "コマンド名 = モジュール名.ファイル名:関数名"
[project.scripts]
sgzu = "sgzu.main:main"
storeparam = "storeparam.main:main"
